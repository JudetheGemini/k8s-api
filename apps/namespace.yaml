apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: namespace
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/JudetheGemini/k8s-api.git
    targetRevision: main
    path: manifests/namespace
  destination:
    server: https://kubernetes.default.svc
    namespace: qoves-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
